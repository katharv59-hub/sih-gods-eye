[project]
name = "gods-eye"
version = "0.1.0"
description = "Real-time situational awareness platform — perception → memory → reasoning"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.0.0",        # YOLOv8
    "torchreid>=0.2.5",          # OSNet / Re-ID
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
    "pydantic>=2.6.0",
    "supervision>=0.28.0,<0.30.0",  # ByteTrack deprecated in 0.28, removed in 0.30 — ADR-005
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "motmetrics>=1.4.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["cv2", "ultralytics", "supervision", "torchreid"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
