    transition_priors:
      cam_entrance: 0.8
    zones:
      - zone_id: "parking_entry"
        display_name: "Parking Entry"
        zone_type: "entrance"
        polygon: [[0.4, 0.6], [0.6, 0.6], [0.6, 0.9], [0.4, 0.9]]
        expected_dwell_s: [1.0, 15.0]
