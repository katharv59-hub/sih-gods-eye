        polygon: [[0.0, 0.3], [1.0, 0.3], [1.0, 0.7], [0.0, 0.7]]
        expected_dwell_s: [5.0, 60.0]

  - camera_id: "cam_parking"
    display_name: "Parking Lot"
    source_uri: "rtsp://192.168.1.13:554/stream1"
